name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and Build APK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
        unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses
        sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"

        mkdir -p app/src/main/java/com/mysweety/os
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="bg_dark">#050814</color>
            <color name="cyan_glow">#00E5FF</color>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/styles.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.MySweetyOS" parent="android:Theme.Material.Light.NoActionBar">
                <item name="android:windowBackground">@color/bg_dark</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="@color/bg_dark"
            android:gravity="center">

            <LinearLayout
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:gravity="center"
                android:padding="20dp">

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="💠"
                    android:textSize="80sp" />

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="20dp"
                    android:text="MY SWEETY AI"
                    android:textColor="@color/cyan_glow"
                    android:textSize="26sp"
                    android:textStyle="bold" />

                <TextView
                    android:id="@+id/status_text"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="15dp"
                    android:text="Say 'Sweety' to activate..."
                    android:textColor="#B3FFFFFF"
                    android:textSize="15sp" />

                <TextView
                    android:id="@+id/ai_response"
                    android:layout_width="280dp"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="20dp"
                    android:gravity="center"
                    android:text="Smart Power & Charging Manager Active"
                    android:textColor="#00E5FF"
                    android:textSize="14sp" />
            </LinearLayout>
        </RelativeLayout>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.mysweety.os">

            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.FLASHLIGHT" />
            <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
            <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
            <uses-permission android:name="android.permission.BLUETOOTH" />
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

            <application 
                android:label="My Sweety OS"
                android:theme="@style/Theme.MySweetyOS"
                android:usesCleartextTraffic="true">
                
                <activity 
                    android:name=".MainActivity" 
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/mysweety/os/MainActivity.java
        package com.mysweety.os;

        import android.Manifest;
        import android.app.Activity;
        import android.content.BroadcastReceiver;
        import android.content.Context;
        import android.content.Intent;
        import android.content.IntentFilter;
        import android.content.pm.PackageManager;
        import android.hardware.camera2.CameraManager;
        import android.net.Uri;
        import android.net.wifi.WifiManager;
        import android.os.Bundle;
        import android.os.Handler;
        import android.os.Looper;
        import android.speech.RecognitionListener;
        import android.speech.RecognizerIntent;
        import android.speech.SpeechRecognizer;
        import android.widget.TextView;

        import java.util.ArrayList;
        import java.util.Locale;

        public class MainActivity extends Activity {

            private SpeechRecognizer speechRecognizer;
            private TextView statusText, aiResponseText;
            private Handler handler;
            private boolean waitingForCmd = false;
            private BroadcastReceiver powerReceiver;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                statusText = findViewById(R.id.status_text);
                aiResponseText = findViewById(R.id.ai_response);
                handler = new Handler(Looper.getMainHandler());

                if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED ||
                    checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                    requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA}, 100);
                } else {
                    startVoiceRecognition();
                }

                registerPowerReceiver();
            }

            private void registerPowerReceiver() {
                powerReceiver = new BroadcastReceiver() {
                    @Override
                    public void onReceive(Context context, Intent intent) {
                        if (Intent.ACTION_POWER_CONNECTED.equals(intent.getAction())) {
                            aiResponseText.setText("Sweety: Charger connected! Mobile Data is ON, Wi-Fi optimized.");
                            optimizeOnCharging();
                        }
                    }
                };
                registerReceiver(powerReceiver, new IntentFilter(Intent.ACTION_POWER_CONNECTED));
            }

            private void optimizeOnCharging() {
                try {
                    WifiManager wifiManager = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                    if (wifiManager != null && wifiManager.isWifiEnabled()) {
                        wifiManager.setWifiEnabled(false);
                    }
                } catch (Exception e) {}
            }

            private void startVoiceRecognition() {
                handler.post(() -> {
                    try {
                        if (speechRecognizer != null) {
                            speechRecognizer.destroy();
                        }
                    } catch (Exception e) {}

                    speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                    speechRecognizer.setRecognitionListener(new RecognitionListener() {
                        @Override public void onReadyForSpeech(Bundle params) {
                            statusText.setText(waitingForCmd ? "Listening command..." : "Listening for 'Sweety'...");
                        }
                        @Override public void onBeginningOfSpeech() {}
                        @Override public void onRmsChanged(float rmsdB) {}
                        @Override public void onBufferReceived(byte[] buffer) {}
                        @Override public void onEndOfSpeech() { statusText.setText("Processing..."); }
                        @Override public void onError(int error) {
                            restartListening(1500);
                        }
                        @Override public void onResults(Bundle results) {
                            ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                            if (matches != null && !matches.isEmpty()) {
                                String text = matches.get(0).toLowerCase();

                                if (!waitingForCmd) {
                                    if (text.contains("sweety") || text.contains("स्वीटी")) {
                                        waitingForCmd = true;
                                        aiResponseText.setText("Yes Boss!");
                                        statusText.setText("Activated!");
                                        startVoiceRecognition();
                                    } else {
                                        restartListening(500);
                                    }
                                } else {
                                    waitingForCmd = false;
                                    aiResponseText.setText("You: " + matches.get(0));
                                    processCommand(matches.get(0));
                                }
                            } else {
                                restartListening(1000);
                            }
                        }
                        @Override public void onPartialResults(Bundle partialResults) {}
                        @Override public void onEvent(int eventType, Bundle params) {}
                    });

                    try {
                        Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                        intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                        intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault());
                        speechRecognizer.startListening(intent);
                    } catch (Exception e) {}
                });
            }

            private void restartListening(long delay) {
                handler.postDelayed(this::startVoiceRecognition, delay);
            }

            private void processCommand(String query) {
                String lower = query.toLowerCase();

                if (lower.contains("torch on") || lower.contains("flashlight on") || lower.contains("लाइट जलाओ")) {
                    setTorch(true);
                    aiResponseText.setText("Sweety: Torch ON");
                    restartListening(3000);
                    return;
                }
                if (lower.contains("torch off") || lower.contains("flashlight off") || lower.contains("लाइट बंद करो")) {
                    setTorch(false);
                    aiResponseText.setText("Sweety: Torch OFF");
                    restartListening(3000);
                    return;
                }
                if (lower.contains("youtube") || lower.contains("युट्यूब")) {
                    openLink("https://www.youtube.com");
                    return;
                }
                if (lower.contains("google") || lower.contains("गूगल")) {
                    openLink("https://www.google.com");
                    return;
                }

                aiResponseText.setText("Sweety: Command received!");
                restartListening(3000);
            }

            private void setTorch(boolean on) {
                try {
                    CameraManager cm = (CameraManager) getSystemService(CAMERA_SERVICE);
                    String id = cm.getCameraIdList()[0];
                    cm.setTorchMode(id, on);
                } catch (Exception e) {}
            }

            private void openLink(String url) {
                try {
                    Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                    startActivity(intent);
                    aiResponseText.setText("Sweety: Opened!");
                } catch (Exception e) {}
                restartListening(3000);
            }

            @Override
            protected void onDestroy() {
                super.onDestroy();
                if (powerReceiver != null) {
                    unregisterReceiver(powerReceiver);
                }
            }

            @Override
            public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                if (requestCode == 100 && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                    startVoiceRecognition();
                }
            }
        }
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF

        cat << 'EOF' > settings.gradle
        rootProject.name = "My Sweety OS"
        include ':app'
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            namespace 'com.mysweety.os'
            compileSdkVersion 34

            defaultConfig {
                applicationId "com.mysweety.os"
                minSdkVersion 24
                targetSdkVersion 34
                versionCode 1
                versionName "1.0"
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/platform-tools
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MySweetyOS-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
