name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Wrapper & Project
      run: |
        # सुनिश्चित करें कि फोल्डर और सेटिंग्स सही हैं
        mkdir -p app/src/main
        
        # अगर AndroidManifest.xml नहीं है तो बेसिक बना दें
        if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.mysweety.os"><application android:label="My Sweety OS"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
        fi

        # MainActivity.java चेक करें
        if [ ! -f "app/src/main/MainActivity.java" ]; then
          mkdir -p app/src/main/java/com/mysweety/os
          echo 'package com.mysweety.os; import android.app.Activity; import android.os.Bundle; public class MainActivity extends Activity { @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); } }' > app/src/main/java/com/mysweety.os/MainActivity.java
        fi

        # build.gradle चेक करें
        if [ ! -f "app/build.gradle" ]; then
          echo 'plugins { id "com.android.application" } android { namespace "com.mysweety.os" compileSdk 34 defaultConfig { applicationId "com.mysweety.os" minSdk 24 targetSdk 34 versionCode 1 versionName "1.0" } }' > app/build.gradle
        fi

        # settings.gradle चेक करें
        if [ ! -f "settings.gradle" ]; then
          echo 'include(":app")' > settings.gradle
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } } dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle
        fi

        # Gradle Wrapper जनरेट करें ताकि बिना किसी एरर के बिल्ड हो सके
        gradle wrapper --gradle-version 8.2

    - name: Build APK with Wrapper
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MySweetyOS-App-Debug
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
