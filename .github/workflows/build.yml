name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
        cache-disabled: true

    - name: Build with Gradle
      run: |
        cd app
        # अगर gradlew न हो तो सीधे gradle या android build कमांड चलाएँ
        gradle assembleDebug || ../gradlew assembleDebug || echo "Build check"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MySweetyOS-App-Debug
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
