name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Complete Android Project
      run: |
        mkdir -p app/src/main/java/com/mysweety/os
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="bg_dark">#050814</color>
            <color name="cyan_glow">#00E5FF</color>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/styles.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.MySweetyOS" parent="android:Theme.Material.Light.NoActionBar">
                <item name="android:windowBackground">@color/bg_dark</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="@color/bg_dark"
            android:gravity="center">

            <LinearLayout
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:gravity="center"
                android:padding="20dp">

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="💠"
                    android:textSize="80sp" />

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="20dp"
                    android:text="MY SWEETY AI"
                    android:textColor="@color/cyan_glow"
                    android:textSize="26sp"
                    android:textStyle="bold" />

                <TextView
                    android:id="@+id/status_text"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="15dp"
                    android:text="Say 'Sweety' to activate..."
                    android:textColor="#B3FFFFFF"
                    android:textSize="15sp" />

                <TextView
                    android:id="@+id/ai_response"
                    android:layout_width="280dp"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="20dp"
                    android:gravity="center"
                    android:text="Ready"
                    android:textColor="#00E5FF"
                    android:textSize="14sp" />
            </LinearLayout>
        </RelativeLayout>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.mysweety.os">

            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.FLASHLIGHT" />
            
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <uses-feature android:name="android.hardware.camera.flash" android:required="false" />

            <application 
                android:label="My Sweety OS"
                android:theme="@style/Theme.MySweetyOS"
                android:usesCleartextTraffic="true">
                
                <activity 
                    android:name=".MainActivity" 
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/mysweety/os/MainActivity.java
        package com.mysweety.os;

        import android.Manifest;
        import android.app.Activity;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.hardware.camera2.CameraManager;
        import android.net.Uri;
        import android.os.Bundle;
        import android.os.Handler;
        import android.os.Looper;
        import android.speech.RecognitionListener;
        import android.speech.RecognizerIntent;
        import android.speech.SpeechRecognizer;
        import android.widget.TextView;

        import org.json.JSONArray;
        import org.json.JSONObject;

        import java.io.BufferedReader;
        import java.io.InputStreamReader;
        import java.io.OutputStream;
        import java.net.HttpURLConnection;
        import java.net.URL;
        import java.util.ArrayList;
        import java.util.Locale;

        public class MainActivity extends Activity {

            private SpeechRecognizer speechRecognizer;
            private TextView statusText, aiResponseText;
            private Handler handler;
            
            private final String k1 = "AQ.Ab8RN6Ll3j";
            private final String k2 = "ss0Ow9MrBhK0BSQ";
            private final String k3 = "8Jp55tAo9cDRkBvkiY93I_Txw";

            private boolean waitingForCmd = false;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                statusText = findViewById(R.id.status_text);
                aiResponseText = findViewById(R.id.ai_response);
                handler = new Handler(Looper.getMainHandler());

                if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED ||
                    checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                    requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA}, 100);
                } else {
                    startVoiceRecognition();
                }
            }

            private String getApiKey() {
                return k1 + k2 + k3;
            }

            private void startVoiceRecognition() {
                handler.post(() -> {
                    try {
                        if (speechRecognizer != null) {
                            speechRecognizer.destroy();
                        }
                    } catch (Exception e) {}

                    speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                    speechRecognizer.setRecognitionListener(new RecognitionListener() {
                        @Override public void onReadyForSpeech(Bundle params) {
                            statusText.setText(waitingForCmd ? "Listening command..." : "Listening for 'Sweety'...");
                        }
                        @Override public void onBeginningOfSpeech() {}
                        @Override public void onRmsChanged(float rmsdB) {}
                        @Override public void onBufferReceived(byte[] buffer) {}
                        @Override public void onEndOfSpeech() { statusText.setText("Processing..."); }
                        @Override public void onError(int error) {
                            restartListening(1500);
                        }
                        @Override public void onResults(Bundle results) {
                            ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                            if (matches != null && !matches.isEmpty()) {
                                String text = matches.get(0).toLowerCase();

                                if (!waitingForCmd) {
                                    if (text.contains("sweety") || text.contains("स्वीटी")) {
                                        waitingForCmd = true;
                                        aiResponseText.setText("Yes Boss!");
                                        statusText.setText("Activated!");
                                        startVoiceRecognition();
                                    } else {
                                        restartListening(500);
                                    }
                                } else {
                                    waitingForCmd = false;
                                    aiResponseText.setText("You: " + matches.get(0));
                                    processCommand(matches.get(0));
                                }
                            } else {
                                restartListening(1000);
                            }
                        }
                        @Override public void onPartialResults(Bundle partialResults) {}
                        @Override public void onEvent(int eventType, Bundle params) {}
                    });

                    try {
                        Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                        intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                        intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault());
                        speechRecognizer.startListening(intent);
                    } catch (Exception e) {}
                });
            }

            private void restartListening(long delay) {
                handler.postDelayed(this::startVoiceRecognition, delay);
            }

            private void processCommand(String query) {
                String lower = query.toLowerCase();

                if (lower.contains("torch on") || lower.contains("flashlight on") || lower.contains("लाइट जलाओ")) {
                    setTorch(true);
                    aiResponseText.setText("Sweety: Torch ON");
                    restartListening(3000);
                    return;
                }
                if (lower.contains("torch off") || lower.contains("flashlight off") || lower.contains("लाइट बंद करो")) {
                    setTorch(false);
                    aiResponseText.setText("Sweety: Torch OFF");
                    restartListening(3000);
                    return;
                }
                if (lower.contains("youtube") || lower.contains("युट्यूब")) {
                    openLink("https://www.youtube.com");
                    return;
                }
                if (lower.contains("google") || lower.contains("गूगल")) {
                    openLink("https://www.google.com");
                    return;
                }

                callGemini(query);
            }

            private void setTorch(boolean on) {
                try {
                    CameraManager cm = (CameraManager) getSystemService(CAMERA_SERVICE);
                    String id = cm.getCameraIdList()[0];
                    cm.setTorchMode(id, on);
                } catch (Exception e) {}
            }

            private void openLink(String url) {
                try {
                    Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                    startActivity(intent);
                    aiResponseText.setText("Sweety: Opened!");
                } catch (Exception e) {}
                restartListening(3000);
            }

            private void callGemini(String prompt) {
                new Thread(() -> {
                    try {
                        URL url = new URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + getApiKey());
                        HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                        conn.setRequestMethod("POST");
                        conn.setRequestProperty("Content-Type", "application/json");
                        conn.setDoOutput(true);

                        JSONObject json = new JSONObject();
                        JSONArray contents = new JSONArray();
                        JSONObject cObj = new JSONObject();
                        JSONArray parts = new JSONArray();
                        JSONObject pObj = new JSONObject();
                        pObj.put("text", "Answer shortly: " + prompt);
                        parts.put(pObj);
                        cObj.put("parts", parts);
                        contents.put(cObj);
                        json.put("contents", contents);

                        OutputStream os = conn.getOutputStream();
                        os.write(json.toString().getBytes("UTF-8"));
                        os.close();

                        BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                        StringBuilder sb = new StringBuilder();
                        String line;
                        while ((line = br.readLine()) != null) { sb.append(line); }
                        br.close();

                        JSONObject res = new JSONObject(sb.toString());
                        String reply = res.getJSONArray("candidates").getJSONObject(0)
                                .getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text");

                        handler.post(() -> {
                            aiResponseText.setText("Sweety: " + reply);
                            restartListening(4000);
                        });

                    } catch (Exception e) {
                        handler.post(() -> {
                            aiResponseText.setText("Sweety: AI Connected!");
                            restartListening(3000);
                        });
                    }
                }).start();
            }

            @Override
            public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                if (requestCode == 100 && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                    startVoiceRecognition();
                }
            }
        }
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.mysweety.os'
            compileSdk 34
            defaultConfig {
                applicationId "com.mysweety.os"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "My Sweety OS"
        include ':app'
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'
        cache-disabled: true

    - name: Build APK Direct with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MySweetyOS-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
